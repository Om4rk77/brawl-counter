<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Brawl Counter</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef0f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brawl Counter">
<meta name="description" content="Counters, builds, mapas, composições e draft para todos os brawlers do Brawl Stars, com dados dos jogadores do topo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%235aa2ff%22/%3E%3Cstop offset=%221%22 stop-color=%22%231d5fe0%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22url(%23g)%22/%3E%3Cpath d=%22M18 46 46 18M26 18h-8v8M38 46h8v-8%22 stroke=%22white%22 stroke-width=%225%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%232f7cf6%22/%3E%3Cpath d=%22M18 46 46 18M26 18h-8v8M38 46h8v-8%22 stroke=%22white%22 stroke-width=%225%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<style>
/* =====================================================================
   Brawl Counter — visual "Liquid Glass" (iOS 26)
   Vidro só no que flutua (barra de abas, cabeçalho, menus, folhas, herói);
   listas em superfícies sólidas para ler bem. Tudo fluido por container.
   ===================================================================== */
:root{
  --bg:#eef0f6; --bg-2:#e6e9f2;
  --surface:#ffffff; --surface-2:#f4f5f9; --surface-3:#eceef4;
  --fill:rgba(120,120,135,.12); --fill-2:rgba(120,120,135,.2); --fill-3:rgba(120,120,135,.28);
  --fg:#0d0d12; --fg-2:#5f6170; --fg-3:#9a9caa; --sep:rgba(60,60,80,.13);
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.76); --glass-edge:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.9); --glass-lo:rgba(0,0,0,.05);
  --glass-shadow:0 1px 1px rgba(10,10,30,.04),0 10px 30px -6px rgba(20,20,60,.16),0 30px 60px -20px rgba(20,20,60,.12);
  --card-shadow:0 1px 2px rgba(16,16,40,.04),0 6px 22px -8px rgba(16,16,40,.12);
  --scrim:rgba(240,242,248,.42);
  --good:#178a3a; --good-bar:#30c75c; --good-tint:rgba(48,199,92,.14);
  --bad:#d0243a; --bad-bar:#ff5f6d; --bad-tint:rgba(255,95,109,.13);
  --mid:#8a6a00; --mid-bar:#d2b24c;
  --live:#2fbf5b;
  --c-NA:#8e8e96; --c-DD:#f2643d; --c-TK:#d9961a; --c-MK:#2f7cf6; --c-AR:#2ea05a; --c-CT:#8a5cf0; --c-AS:#e93d82; --c-SP:#10a8a3;
  --r-I:#8ea7ba; --r-R:#4cc23a; --r-SR:#3a8bff; --r-E:#b04cff; --r-M:#f0414a; --r-L:#f0b400; --r-UL:#ff7a1a;
  --i-gd:#22b14c; --i-sp:#e3a400; --i-hc:#9b4dff; --i-gr:#5e7487;
  --accent:var(--c-MK); --on-accent:#fff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.32,.72,0,1); --bounce:cubic-bezier(.34,1.42,.5,1); --ease:cubic-bezier(.25,.1,.25,1); --out:cubic-bezier(.16,1,.3,1);
  --r-xl:28px; --r-l:22px; --r-m:16px; --r-s:12px;
  --gutter:clamp(14px,3.6vw,32px); --gap:clamp(14px,2.2vw,24px);
  --tab-h:0px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000; --bg-2:#07070b;
  --surface:#1c1c1f; --surface-2:#242428; --surface-3:#2c2c31;
  --fill:rgba(130,130,145,.2); --fill-2:rgba(130,130,145,.3); --fill-3:rgba(130,130,145,.4);
  --fg:#f5f5f8; --fg-2:#a1a2ad; --fg-3:#6c6d78; --sep:rgba(120,120,140,.24);
  --glass:rgba(40,40,46,.52); --glass-2:rgba(52,52,60,.72); --glass-edge:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.18); --glass-lo:rgba(0,0,0,.3);
  --glass-shadow:0 1px 1px rgba(0,0,0,.4),0 12px 34px -6px rgba(0,0,0,.6),0 30px 60px -20px rgba(0,0,0,.5);
  --card-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -10px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.38);
  --good:#4cd97b; --good-bar:#30d158; --good-tint:rgba(48,209,88,.17);
  --bad:#ff7b84; --bad-bar:#ff6961; --bad-tint:rgba(255,105,97,.17);
  --mid:#e5c868; --mid-bar:#b8a456;
  --c-DD:#ff7a55; --c-TK:#f2b13a; --c-MK:#4a93ff; --c-AR:#40c172; --c-CT:#a07cff; --c-AS:#ff5c98; --c-SP:#2cc9c2;
  --i-gd:#3fd067; --i-sp:#ffc629; --i-hc:#b47bff; --i-gr:#8aa1b4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000; --bg-2:#07070b;
  --surface:#1c1c1f; --surface-2:#242428; --surface-3:#2c2c31;
  --fill:rgba(130,130,145,.2); --fill-2:rgba(130,130,145,.3); --fill-3:rgba(130,130,145,.4);
  --fg:#f5f5f8; --fg-2:#a1a2ad; --fg-3:#6c6d78; --sep:rgba(120,120,140,.24);
  --glass:rgba(40,40,46,.52); --glass-2:rgba(52,52,60,.72); --glass-edge:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.18); --glass-lo:rgba(0,0,0,.3);
  --glass-shadow:0 1px 1px rgba(0,0,0,.4),0 12px 34px -6px rgba(0,0,0,.6),0 30px 60px -20px rgba(0,0,0,.5);
  --card-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -10px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.38);
  --good:#4cd97b; --good-bar:#30d158; --good-tint:rgba(48,209,88,.17);
  --bad:#ff7b84; --bad-bar:#ff6961; --bad-tint:rgba(255,105,97,.17);
  --mid:#e5c868; --mid-bar:#b8a456;
  --c-DD:#ff7a55; --c-TK:#f2b13a; --c-MK:#4a93ff; --c-AR:#40c172; --c-CT:#a07cff; --c-AS:#ff5c98; --c-SP:#2cc9c2;
  --i-gd:#3fd067; --i-sp:#ffc629; --i-hc:#b47bff; --i-gr:#8aa1b4;
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);scroll-padding-top:90px}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.008em;overflow-x:hidden}
img{max-width:100%;display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}

/* fundo vivo: manchas de cor desfocadas para o vidro ter o que refratar */
.ambient{position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;overflow:hidden;opacity:.62;transition:opacity .6s}
:root[data-theme="dark"] .ambient{opacity:.42}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ambient{opacity:.42}}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px);will-change:transform}
.ambient i:nth-child(1){width:55vmax;height:55vmax;left:5%;top:0;background:color-mix(in srgb,var(--accent) 55%,transparent);animation:drift1 26s ease-in-out infinite alternate;transition:background-color 1.2s var(--ease)}
.ambient i:nth-child(2){width:45vmax;height:45vmax;right:0;top:20%;background:color-mix(in srgb,#ff7ab8 38%,transparent);animation:drift2 32s ease-in-out infinite alternate}
.ambient i:nth-child(3){width:50vmax;height:50vmax;left:30%;bottom:-10%;background:color-mix(in srgb,#5ad7ff 40%,transparent);animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-14vmax,16vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(-10vmax,-14vmax) scale(1.1)}}

/* material de vidro */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(185%);backdrop-filter:blur(22px) saturate(185%);border:.5px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 var(--glass-lo),var(--glass-shadow)}
.glass.spec::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120px 80px at var(--mx,30%) var(--my,0%),rgba(255,255,255,.38),transparent 70%);opacity:.0;transition:opacity .35s}
.glass.spec:hover::after{opacity:.55}
.glass-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .45s var(--bounce),background-color .25s}
.glass-btn svg{width:19px;height:19px}
.glass-btn:active{transform:scale(.88)}
.press{transition:transform .45s var(--spring),background-color .2s var(--ease),opacity .2s,box-shadow .3s}
.press:active{transform:scale(.965)}
@media (hover:hover){.lift{transition:transform .45s var(--spring),box-shadow .35s var(--ease)}.lift:hover{transform:translateY(-2px)}}

/* ---------- cabeçalho ---------- */
.top{position:sticky;top:0;z-index:50;padding-top:var(--safe-t);transition:background-color .35s,box-shadow .35s}
.top::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(185%);backdrop-filter:blur(24px) saturate(185%);border-bottom:.5px solid var(--sep);
  -webkit-mask:linear-gradient(#000 70%,transparent);mask:linear-gradient(#000 70%,transparent)}
.top.scrolled::before{opacity:1}
.top-in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:760;font-size:17px;letter-spacing:-.025em;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));box-shadow:0 6px 16px -4px color-mix(in srgb,var(--accent) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.45);transition:background .8s var(--ease)}
.brand-mark svg{width:18px;height:18px}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-title{font-family:var(--font-d);font-weight:700;font-size:16px;letter-spacing:-.02em;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .45s var(--spring);white-space:nowrap;pointer-events:none}
.top.scrolled .mini-title{opacity:1;transform:none}
.top-actions{display:flex;gap:8px;justify-content:flex-end}

/* ---------- barra de abas flutuante (lente de vidro) ---------- */
.tabs{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:stretch;padding:4px;border-radius:999px;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.tabs button{position:relative;z-index:2;display:grid;justify-items:center;align-content:center;gap:2px;border-radius:999px;color:var(--fg);font-weight:600;transition:color .3s,transform .4s var(--spring)}
.tabs button svg{width:24px;height:24px;transition:transform .5s var(--bounce)}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs button[aria-selected="true"] svg{transform:scale(1.06)}
.lens{position:absolute;z-index:1;top:4px;bottom:4px;left:0;width:0;border-radius:999px;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--glass-hi) 60%,transparent),color-mix(in srgb,var(--fill) 80%,transparent));
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 .5px var(--glass-edge),0 6px 18px -8px rgba(0,0,0,.25);
  transition:transform .55s var(--bounce),width .55s var(--bounce),opacity .3s,scale .35s var(--spring)}
.lens.moving{scale:1.1 .9}
.tabs.drag .lens{scale:1.14;transition:width .3s var(--spring),scale .3s var(--spring);background:color-mix(in srgb,var(--glass-hi) 35%,transparent);-webkit-backdrop-filter:blur(2px) saturate(220%);backdrop-filter:blur(2px) saturate(220%)}
/* desktop: lente no topo */
.tabs.top-tabs{height:44px;min-width:520px}
.tabs.top-tabs button{padding:0 16px;font-size:14px;letter-spacing:-.01em}
.tabs.top-tabs svg{display:none}
/* celular/tablet: barra embaixo */
.dock{position:fixed;left:0;right:0;bottom:calc(10px + var(--safe-b));z-index:55;display:none;justify-content:center;gap:10px;padding:0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;transition:transform .5s var(--spring)}
.dock>*{pointer-events:auto}
.dock .tabs{height:64px;width:min(100%,560px)}
.dock .tabs button{font-size:10.5px}
.dock .glass-btn{width:64px;height:64px}
.dock .glass-btn svg{width:23px;height:23px}
.dock.min .tabs{height:52px}
.dock.min .tabs button span{opacity:0;height:0;overflow:hidden}
.dock.min .glass-btn{width:52px;height:52px}
@media (max-width:899px){
  :root{--tab-h:calc(84px + var(--safe-b))}
  .dock{display:flex}
  .top-in{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
  .top .tabs{display:none}
  body{padding-bottom:var(--tab-h)}
}
@media (min-width:900px){.mini-title{display:none}}
@media (max-width:420px){.dock .tabs button{font-size:10px}.dock .glass-btn{width:58px;height:58px}}

/* ---------- herói da página ---------- */
.hero{padding-block:clamp(10px,2.6vw,26px) 4px}
.large-title{font-family:var(--font-d);font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin:0;text-wrap:balance}
.sub{color:var(--fg-2);margin:8px 0 0;font-size:14.5px;max-width:74ch;text-wrap:pretty}
.sub .live-dot{margin-right:6px;vertical-align:1px}
.sub b{color:var(--fg);font-weight:650}
.search{position:relative;margin-top:16px;max-width:760px}
.search-field{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;transition:box-shadow .35s var(--ease),transform .4s var(--spring)}
.search-field:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 24%,transparent),var(--glass-shadow)}
.search-field svg{width:18px;height:18px;color:var(--fg-2);flex:none}
.search-field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;height:100%}
.search-field input::placeholder{color:var(--fg-2)}
.search-field input::-webkit-search-cancel-button{-webkit-appearance:none}
.kbd{font-size:11px;color:var(--fg-3);border:1px solid var(--sep);border-radius:7px;padding:1px 7px}
.ac{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:45;border-radius:22px;padding:6px;max-height:min(60vh,440px);overflow:auto;transform-origin:top center;animation:bloom .45s var(--spring)}
@keyframes bloom{from{opacity:0;transform:translateY(-8px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ac-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:15px;width:100%;text-align:left}
.ac-item[aria-selected="true"]{background:var(--fill)}
.ac-item .meta{color:var(--fg-2);font-size:13px;margin-left:auto;white-space:nowrap}
.ac-empty{padding:18px;color:var(--fg-2);text-align:center}

/* ---------- avatar e ícones de item ---------- */
.av{--s:46px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.3);flex:none;position:relative;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(120% 100% at 30% 10%,color-mix(in srgb,var(--cc) 34%,var(--surface-2)),color-mix(in srgb,var(--cc) 14%,var(--surface-2)));box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--cc) 30%,transparent)}
.av img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity .45s var(--ease),transform .6s var(--out)}
.av img.ok{opacity:1;transform:none}
.av.loading::after,.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.15s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.av .mono{font-family:var(--font-r);font-weight:800;font-size:calc(var(--s)*.42);color:#fff;letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.av.mono-bg{background:linear-gradient(145deg,color-mix(in srgb,var(--rc) 75%,#fff),var(--rc))}
.av-stack{display:flex}
.av-stack .av{--s:40px;border-radius:13px;box-shadow:0 0 0 2.5px var(--surface)}
.av-stack .av+.av{margin-left:-11px}
.ico{--s:44px;width:var(--s);height:var(--s);flex:none;display:grid;place-items:center;border-radius:calc(var(--s)*.28);position:relative;background:color-mix(in srgb,var(--ic) 14%,var(--surface-2));color:var(--ic);overflow:hidden}
.ico img{width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.ico.full img{width:100%;height:100%}
.ico svg{width:56%;height:56%}
.cls-ico{--s:20px;width:var(--s);height:var(--s);flex:none;display:inline-grid;place-items:center;border-radius:calc(var(--s)*.32);color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--cc) 65%,#fff),var(--cc));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px -2px color-mix(in srgb,var(--cc) 70%,transparent)}
.cls-ico svg{width:64%;height:64%}

/* ---------- blocos ---------- */
main{padding-block:16px 48px;view-transition-name:main}
.cq{container-type:inline-size}
.card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--card-shadow);position:relative;overflow:hidden}
.group{display:grid;gap:10px;min-width:0;align-content:start}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-inline:6px;flex-wrap:wrap}
.gh h2{font-family:var(--font-d);font-size:clamp(19px,2.4vw,22px);font-weight:760;letter-spacing:-.03em;margin:0;text-wrap:balance}
.gh .note{font-size:12.5px;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.list{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--card-shadow);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:72px;border-top:.5px solid var(--sep)}
button.row:hover,a.row:hover{background:var(--surface-2)}
.row .t{font-weight:640;font-size:15.5px;line-height:1.22;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--fg-2);display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap;min-width:0}
.row .r{display:grid;justify-items:end;gap:6px;min-width:92px}
.val{font-weight:720;font-size:15px;white-space:nowrap}
.val.good{color:var(--good)} .val.bad{color:var(--bad)} .val.mid{color:var(--mid)} .val.muted{color:var(--fg-3);font-weight:600}
.bar{width:92px;height:6px;border-radius:6px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--b,var(--accent));width:0;transition:width 1.1s var(--out)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 8px;border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:640;white-space:nowrap}
.chip.cls{background:color-mix(in srgb,var(--cc) 15%,transparent);color:color-mix(in srgb,var(--cc) 78%,var(--fg))}
.chip.good{background:var(--good-tint);color:var(--good);padding:0 11px}
.chip.bad{background:var(--bad-tint);color:var(--bad);padding:0 11px}
.chip.plain{padding:0 11px}
.chip img{width:16px;height:16px;object-fit:contain}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rc);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 22%,transparent)}
.tier{display:inline-grid;place-items:center;min-width:36px;height:32px;padding:0 9px;border-radius:11px;font-family:var(--font-r);font-weight:850;font-size:16px;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc));box-shadow:0 6px 14px -6px var(--tc),inset 0 1px 0 rgba(255,255,255,.35)}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.hscroll::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 10px;border-radius:999px;background:var(--surface);box-shadow:var(--card-shadow);font-size:13.5px;font-weight:620;white-space:nowrap;flex:none;transition:background-color .25s,color .25s,transform .45s var(--spring),box-shadow .3s}
.fchip.no-ico{padding:0 14px}
.fchip img{width:20px;height:20px;object-fit:contain}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
.empty{padding:22px 16px;color:var(--fg-2);text-align:center;font-size:14px}
.ghost{height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:640;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:680;font-size:15px;background:var(--accent);color:var(--on-accent);box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 80%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.soft{background:color-mix(in srgb,var(--accent) 13%,transparent);color:color-mix(in srgb,var(--accent) 85%,var(--fg));box-shadow:none}
.btn svg{width:17px;height:17px}
.mini-note{font-size:12.5px;color:var(--fg-2);padding:0 6px;max-width:78ch;margin:0}
.duo{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr)}
@container (min-width:680px){.duo{grid-template-columns:repeat(2,minmax(0,1fr))}}
.more{display:block;width:100%;padding:12px;font-size:14px;font-weight:640;color:var(--accent);border-top:.5px solid var(--sep)}
.src-tag{font-size:11px;font-weight:680;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--fg-2);white-space:nowrap}
.src-tag.live{background:color-mix(in srgb,var(--live) 16%,transparent);color:var(--good)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent);animation:pulse 2s infinite}
.live-dot.off{background:var(--mid-bar);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.kicker{font-size:12px;font-weight:720;color:var(--good);text-transform:uppercase;letter-spacing:.07em}
.swap-in{animation:swapIn .7s var(--out) both}
@keyframes swapIn{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.stagger>*{animation:swapIn .65s var(--out) both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(6){animation-delay:.2s}.stagger>*:nth-child(n+7){animation-delay:.24s}

/* ---------- perfil ---------- */
.mu{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr)}
@media (min-width:1120px){.mu{grid-template-columns:minmax(0,1fr) 400px;align-items:start}.picker{position:sticky;top:calc(var(--safe-t) + 72px);max-height:calc(100dvh - var(--safe-t) - 90px);overflow:auto;overscroll-behavior:contain}}
.profile{display:grid;gap:clamp(18px,2.6vw,28px);min-width:0}
.p-card{border-radius:var(--r-xl);overflow:hidden;position:relative;isolation:isolate}
.p-card::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(90% 120% at 0% 0%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 62%),radial-gradient(70% 90% at 100% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
.p-hero{padding:clamp(18px,3vw,28px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(14px,2.4vw,24px);align-items:center}
.p-hero .av{--s:clamp(88px,12vw,120px);border-radius:30%;box-shadow:0 18px 40px -14px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 0 0 .5px rgba(255,255,255,.3)}
.p-name{font-family:var(--font-d);font-size:clamp(30px,5vw,46px);font-weight:820;letter-spacing:-.045em;line-height:1;margin:0 0 12px;text-wrap:balance}
.p-actions{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:2}
.p-actions .glass-btn[aria-pressed="true"]{color:#f5b301}
.p-actions .glass-btn[aria-pressed="true"] svg{fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:.5px solid var(--glass-edge)}
.stat{padding:14px clamp(12px,2vw,20px) 16px;display:grid;gap:3px;align-content:start;min-width:0}
.stat+.stat{border-left:.5px solid var(--glass-edge)}
.stat .k{font-size:12px;color:var(--fg-2);font-weight:560}
.stat .v{font-family:var(--font-d);font-size:clamp(22px,3.2vw,30px);font-weight:760;letter-spacing:-.035em;line-height:1.05}
.stat .v small{font-size:.55em;font-weight:650;color:var(--fg-2);margin-left:1px}
.stat .h{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:5px;min-width:0}
.mode-ic{width:46px;height:46px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.mode-ic img{width:32px;height:32px;object-fit:contain}
.tips{padding:6px 0}
.tip{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:11px 16px;align-items:start}
.tip .ti{width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center}
.tip .ti svg{width:17px;height:17px}
.tip p{margin:4px 0 0;max-width:64ch}
.best{padding:clamp(16px,2.4vw,22px);display:grid;gap:16px}
.best-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;text-align:left;border-radius:20px;padding:12px;margin:-12px;width:calc(100% + 24px)}
.best-main:hover{background:var(--surface-2)}
.best-main .av{--s:76px}
.best-name{font-family:var(--font-d);font-size:24px;font-weight:780;letter-spacing:-.03em;margin:2px 0 4px}
.best-why{color:var(--fg-2);margin:0;max-width:62ch}
.alts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:.5px solid var(--sep);padding-top:14px}
.alts>span{font-size:13px;color:var(--fg-2);margin-right:4px}
.alt{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 4px;border-radius:999px;background:var(--fill);font-weight:640;font-size:14px}
.alt .av{--s:32px;border-radius:50%}
.alt b{color:var(--good);font-weight:740;font-size:12.5px}
.it-alt{font-size:12.5px;color:var(--fg-2);display:flex;align-items:center;gap:6px;margin-top:3px}
.it-alt img{width:16px;height:16px;object-fit:contain}
.build-mini{display:flex;flex-wrap:wrap;gap:6px}
.bchip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:3px 11px 3px 4px;border-radius:12px;background:color-mix(in srgb,var(--ic) 11%,var(--surface-2));font-size:12.5px;font-weight:640;line-height:1.2}
.bchip .ico{--s:26px;border-radius:8px}

/* mapas */
.mapseg{margin-bottom:2px}
.maps{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.map{position:relative;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--card-shadow);aspect-ratio:16/11;isolation:isolate}
.map img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity .5s,transform 1.2s var(--out)}
.map img.ok{opacity:1;transform:scale(1)}
.map:hover img{transform:scale(1.04)}
.map .cap{position:absolute;left:8px;right:8px;bottom:8px;border-radius:15px;padding:9px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.map .mn{font-weight:700;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map .mm{font-size:11.5px;color:var(--fg-2);display:flex;align-items:center;gap:5px;margin-top:2px}
.map .mm img{position:static;width:14px;height:14px;opacity:1;transform:none}
.map .rank{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.empty-art{display:grid;justify-items:center;gap:10px;padding:28px 20px;text-align:center;color:var(--fg-2)}
.empty-art .art{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.empty-art .art svg{width:32px;height:32px}
.empty-art b{color:var(--fg);font-size:16px}
.empty-art p{margin:0;max-width:52ch;font-size:14px}

/* seletor de brawlers */
.picker{border-radius:var(--r-xl);padding:16px 0 18px;min-width:0;background:var(--surface);box-shadow:var(--card-shadow)}
.picker h2{font-family:var(--font-d);font-size:21px;font-weight:760;letter-spacing:-.03em;margin:0 16px 12px;display:flex;justify-content:space-between;align-items:baseline}
.picker h2 small{font-size:13px;font-weight:540;color:var(--fg-2);letter-spacing:0}
.picker .hscroll{padding:2px 16px 8px}
.picker .fchip{box-shadow:none;background:var(--fill)}
.picker .fchip[aria-pressed="true"]{background:var(--fg)}
.mini-h{font-size:12px;font-weight:650;color:var(--fg-2);text-transform:uppercase;letter-spacing:.07em;margin:16px 16px 8px}
.mini-row{display:flex;gap:10px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
.mini-row::-webkit-scrollbar{display:none}
.mini-row .gcell{width:64px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:14px 8px;padding:0 16px}
.gcell{display:grid;justify-items:center;gap:6px;padding:4px 0;border-radius:16px;min-width:0;position:relative;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.gcell .av{--s:58px;transition:transform .45s var(--spring),box-shadow .35s}
@media (hover:hover){.gcell:hover .av{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 22px -8px color-mix(in srgb,var(--cc) 60%,transparent)}}
.gcell span{font-size:11.5px;font-weight:620;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.gcell[aria-current="true"] .av{box-shadow:0 0 0 2.5px var(--surface),0 0 0 5px var(--accent)}
.gcell[aria-current="true"] span{color:var(--fg)}
.gcell[disabled]{opacity:.3;cursor:not-allowed}
.gcell.held .av{transform:scale(.9)}

/* ---------- draft ---------- */
.draft{display:grid;gap:var(--gap)}
.teams{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@container (min-width:820px){.teams{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.team{padding:16px;display:grid;gap:12px;border-radius:var(--r-xl)}
.team-h{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.team-h h3{margin:0;font-family:var(--font-d);font-size:17px;font-weight:740;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tag{font-size:11.5px;font-weight:680;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--fg-2)}
.team-dot{width:10px;height:10px;border-radius:50%;background:var(--bad-bar);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad-bar) 22%,transparent)}
.team-dot.ally{background:var(--c-MK);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-MK) 22%,transparent)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slots.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot-b{position:relative;display:grid;justify-items:center;gap:7px;padding:14px 6px 12px;border-radius:22px;background:var(--surface-2);min-width:0;width:100%;border:1.5px dashed transparent}
.slot-b.empty-slot{border-color:var(--fill-3);background:transparent}
.slot-b .av{--s:clamp(48px,7vw,62px)}
.slot-b .nm{font-size:13px;font-weight:660;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-b .plus{width:clamp(48px,7vw,62px);aspect-ratio:1;border-radius:18px;display:grid;place-items:center;background:var(--fill);color:var(--fg-2)}
.slot-b .plus svg{width:22px;height:22px}
.slot-x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--fill-2);display:grid;place-items:center}
.slot-x svg{width:11px;height:11px}
.res-solo{padding:clamp(16px,2.4vw,22px);display:grid;gap:16px}
.solo-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;text-align:left}
.solo-top .av{--s:clamp(70px,10vw,90px);box-shadow:0 14px 30px -12px color-mix(in srgb,var(--cc) 70%,transparent)}
.vs-list{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.vs-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--surface-2);min-width:0}
.vs-item .av{--s:36px}
.vs-item div{min-width:0}
.vs-item .vn{font-size:12.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trio{padding:clamp(16px,2.4vw,22px);display:grid;gap:16px}
.trio-cols{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@container (min-width:720px){.trio-cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
.member{padding:14px;border-radius:20px;background:var(--surface-2);display:grid;gap:10px;align-content:start;min-width:0}
.member-h{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.member-h .av{--s:54px}
.member-h .nm{font-weight:740;font-size:16.5px}
.member .lines{display:grid;gap:5px;font-size:13px}
.member .lines span{display:flex;gap:6px;align-items:baseline}
.member .lock{font-size:11px;font-weight:740;color:var(--c-MK);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:4px}
.member .lock svg{width:12px;height:12px}
.syn{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.syn>span:first-child{font-size:13px;color:var(--fg-2)}
.alt-trio{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;position:relative;width:100%;text-align:left}
.alt-trio+.alt-trio::before{content:"";position:absolute;top:0;left:14px;right:14px;border-top:.5px solid var(--sep)}
.alt-trio:hover{background:var(--surface-2)}
.alt-trio .t{font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.bd{border-top:.5px solid var(--sep);padding-top:10px}
details.bd summary{cursor:pointer;list-style:none;font-size:13.5px;font-weight:680;color:var(--accent);display:flex;align-items:center;gap:6px}
details.bd summary::-webkit-details-marker{display:none}
details.bd summary svg{width:12px;height:12px;transition:transform .35s var(--spring)}
details.bd[open] summary svg{transform:rotate(90deg)}
details.bd .build-mini{margin-top:10px}
.method{font-size:12.5px;color:var(--fg-2);padding:0 6px;max-width:82ch;margin:0}

/* ---------- composições ---------- */
.comp-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;position:relative}
.comp-row+.comp-row::before{content:"";position:absolute;top:0;left:14px;right:14px;border-top:.5px solid var(--sep)}
.comp-row .t{font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-row .s{font-size:12.5px;color:var(--fg-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-row .r{display:grid;justify-items:end;gap:6px}
.comp-row .wr{font-family:var(--font-d);font-size:20px;font-weight:780;letter-spacing:-.02em}
.mini-btn{font-size:12.5px;font-weight:680;color:var(--accent);padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);white-space:nowrap}
@container (max-width:560px){.comp-row{grid-template-columns:auto minmax(0,1fr);row-gap:10px}.comp-row .t,.comp-row .s{white-space:normal;line-height:1.25}.comp-row .r{grid-column:1/-1;display:flex;align-items:center;gap:10px}.comp-row .r .mini-btn{margin-left:auto}.alt-trio .t{white-space:normal;line-height:1.25}}

/* ---------- agora ---------- */
.now-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.ev{display:grid;align-content:start;border-radius:var(--r-xl);overflow:hidden;background:var(--surface);box-shadow:var(--card-shadow)}
.ev-art{position:relative;aspect-ratio:16/8;overflow:hidden;background:color-mix(in srgb,var(--mc,var(--accent)) 25%,var(--surface-2))}
.ev-art img.mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.1);transition:opacity .6s,transform 1.4s var(--out)}
.ev-art img.mapimg.ok{opacity:1;transform:scale(1)}
.ev-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.45))}
.ev-head{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border-radius:18px;padding:8px 12px 8px 8px}
.ev-head .mode-ic{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--mc,var(--accent)) 35%,transparent)}
.ev-head .mode-ic img{width:28px;height:28px}
.ev-mode{font-size:11.5px;font-weight:720;color:var(--fg-2);text-transform:uppercase;letter-spacing:.06em}
.ev-map{font-family:var(--font-d);font-size:17px;font-weight:760;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-time{font-size:12px;font-weight:650;color:var(--fg-2);text-align:right;white-space:nowrap}
.ev-time b{display:block;font-size:15px;color:var(--fg)}
.ev-body{padding:12px;display:grid;gap:10px}
.ev .list{box-shadow:none;background:var(--surface-2)}
.ev .row{padding:8px 12px}.ev .row .av{--s:38px}.ev .row+.row::before{left:62px}
.ev-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ev.ended{opacity:.55}

/* ---------- ranking ---------- */
.filters{display:grid;gap:12px;margin-bottom:16px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;height:38px;border-radius:999px;border:0;background:var(--surface);box-shadow:var(--card-shadow);padding:0 36px 0 14px;font-size:13.5px;font-weight:640;cursor:pointer}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:1.8px solid var(--fg-2);border-bottom:1.8px solid var(--fg-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.count{margin-left:auto;color:var(--fg-2);font-size:13px}
.rk{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--card-shadow);overflow:hidden}
.rk-row{display:grid;grid-template-columns:34px minmax(0,1.6fr) minmax(0,.9fr) minmax(0,.9fr) minmax(130px,1.1fr) 70px 80px 56px;align-items:center;gap:10px;padding:8px 14px;position:relative;width:100%;text-align:left}
.rk-row+.rk-row::before{content:"";position:absolute;top:0;left:14px;right:14px;border-top:.5px solid var(--sep)}
.rk-head{font-size:12px;font-weight:620;color:var(--fg-2);padding-block:12px 10px}
.rk-head button{display:inline-flex;align-items:center;gap:4px;font-weight:620;color:inherit}
.rk-head [aria-sort] button{color:var(--fg)}
.rk-head .arr{width:10px;height:10px;opacity:0;transition:transform .35s var(--spring),opacity .2s}
.rk-head [aria-sort] .arr{opacity:1}
.rk-head [aria-sort="ascending"] .arr{transform:rotate(180deg)}
button.rk-row:hover{background:var(--surface-2)}
.rk-n{color:var(--fg-3);font-weight:680;font-size:13px;text-align:center}
.bcell{display:flex;align-items:center;gap:11px;font-weight:650;min-width:0}
.bcell .av{--s:40px}
.bcell .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell .sm{display:none;font-size:12px;font-weight:540;color:var(--fg-2);align-items:center;gap:5px;margin-top:2px}
.wrcell{display:flex;align-items:center;gap:10px}
.wrcell .bar{width:auto;flex:1;min-width:40px}
.r-in{animation:rowIn .55s var(--out) both}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rk-row.nomode{grid-template-columns:34px minmax(0,1.6fr) minmax(0,.9fr) minmax(0,.9fr) minmax(130px,1.1fr) 70px 56px}
@container (max-width:860px){.rk-row,.rk-row.nomode{grid-template-columns:30px minmax(0,1.5fr) minmax(110px,1fr) 64px 70px 48px}.rk-row.nomode{grid-template-columns:30px minmax(0,1.5fr) minmax(110px,1fr) 64px 48px}.rk-row .c-cls,.rk-row .c-rar{display:none}.bcell .sm{display:flex}}
@container (max-width:560px){.rk-row,.rk-row.nomode{grid-template-columns:26px minmax(0,1fr) auto 44px;gap:8px;padding-inline:10px}.rk-row .c-pick,.rk-row .c-mode-x{display:none}.rk-row .wrcell .bar{display:none}.rk-row.has-mode .c-wr{display:none}.rk-row.has-mode .c-mode-x{display:block}}

/* ---------- comparar ---------- */
.cmp-top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.slot{border-radius:var(--r-xl);padding:20px 12px;display:grid;justify-items:center;gap:8px;text-align:center;min-width:0;background:var(--surface);box-shadow:var(--card-shadow)}
.slot .av{--s:clamp(64px,11vw,96px)}
.slot .nm{font-family:var(--font-d);font-size:clamp(17px,2.4vw,22px);font-weight:760;letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .chg{font-size:13px;color:var(--accent);font-weight:640}
.vs{align-self:center;font-family:var(--font-r);font-weight:850;color:var(--fg-3);font-size:15px}
.verdict{margin-top:16px;padding:20px;display:grid;gap:6px;text-align:center;border-radius:var(--r-xl)}
.verdict .vk{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-2)}
.verdict .vt{font-family:var(--font-d);font-size:22px;font-weight:780;letter-spacing:-.025em;text-wrap:balance}
.verdict p{margin:0 auto;color:var(--fg-2);max-width:62ch}
.cmp-table{margin-top:16px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);align-items:center;padding:12px 14px;gap:8px;position:relative}
.crow+.crow::before{content:"";position:absolute;top:0;left:14px;right:14px;border-top:.5px solid var(--sep)}
.crow .ck{text-align:center;font-size:12.5px;color:var(--fg-2);font-weight:560}
.crow .cv{font-weight:680;font-size:15px;min-width:0}
.crow .cv:last-child{text-align:right}
.crow .win{color:var(--good)}
.cmp-modes{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:640}
.crow .cv:last-child .cmp-modes{align-items:flex-end}

/* ---------- camadas: folha, menu, menu de contexto ---------- */
#app{transition:transform .55s var(--spring),border-radius .55s var(--spring),filter .45s;transform-origin:50% 0}
body.stacked #app{transform:scale(.94) translateY(10px);border-radius:24px;overflow:hidden;filter:brightness(.92) saturate(.9)}
.scrim{position:fixed;inset:0;z-index:80;background:var(--scrim);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);animation:fade .35s var(--ease) both}
.scrim.light{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.scrim.closing{animation:fadeOut .28s var(--ease) both}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;z-index:90;width:min(680px,100%);max-height:min(86dvh,760px);border-radius:32px 32px 0 0;display:flex;flex-direction:column;padding-bottom:var(--safe-b);background:var(--glass-2);animation:sheetUp .6s var(--spring) both;touch-action:none}
.sheet.closing{animation:sheetDown .38s var(--ease) both}
@media (min-width:760px){.sheet{bottom:50%;border-radius:32px;transform:translateY(50%);animation:popIn .5s var(--spring) both}.sheet.closing{animation:popOut .25s var(--ease) both}}
@keyframes sheetUp{from{transform:translateY(105%)}}
@keyframes sheetDown{to{transform:translateY(105%)}}
@keyframes popIn{from{opacity:0;transform:translateY(50%) scale(.92)}}
@keyframes popOut{to{opacity:0;transform:translateY(50%) scale(.95)}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--fill-3);margin:9px auto 0;flex:none;cursor:grab}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 16px 10px}
.sheet-h h3{margin:0;font-family:var(--font-d);font-size:18px;font-weight:740;flex:1}
.sheet .search-field{margin:0 16px 10px;height:44px;background:var(--fill)}
.sheet .hscroll{padding:2px 16px 10px}
.sheet .fchip{box-shadow:none;background:var(--fill)}
.sheet .fchip[aria-pressed="true"]{background:var(--fg)}
.sheet .grid{overflow:auto;padding-bottom:18px;touch-action:pan-y;overscroll-behavior:contain;flex:1;min-height:0;align-content:start}
.sheet>.grab,.sheet>.sheet-h,.sheet>.search-field,.sheet>.hscroll{flex:none}
.menu{position:fixed;z-index:95;min-width:260px;max-width:calc(100vw - 24px);border-radius:26px;padding:8px;transform-origin:var(--ox,100%) var(--oy,0%);animation:menuIn .5s var(--spring) both;background:var(--glass-2)}
.menu.closing{animation:menuOut .22s var(--ease) both}
@keyframes menuIn{from{opacity:0;transform:scale(.35);filter:blur(10px)}60%{filter:none}to{opacity:1;transform:none}}
@keyframes menuOut{to{opacity:0;transform:scale(.6);filter:blur(6px)}}
.menu .mh{font-size:12px;font-weight:680;color:var(--fg-2);text-transform:uppercase;letter-spacing:.07em;padding:10px 12px 6px}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border-radius:16px;font-size:15.5px;font-weight:560;text-align:left;animation:swapIn .5s var(--out) both}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--fill)}
.menu .mi svg{width:20px;height:20px;flex:none}
.menu .mi .ck{margin-left:auto;color:var(--accent);opacity:0}
.menu .mi[aria-checked="true"] .ck{opacity:1}
.menu .flag{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none;background:var(--fill)}
.menu .sep{height:.5px;background:var(--sep);margin:6px 10px}
.menu .mi.danger{color:var(--bad)}
.segm{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;margin:2px 6px 8px;border-radius:14px;background:var(--fill);position:relative}
.segm button{height:36px;border-radius:11px;font-size:13.5px;font-weight:620;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;z-index:1;transition:color .2s}
.segm button svg{width:16px;height:16px}
.segm button[aria-pressed="true"]{background:var(--surface);box-shadow:0 3px 10px -2px rgba(0,0,0,.15)}
.ctx-prev{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:8px;border-radius:24px}
.ctx-prev .av{--s:64px}
.ctx-prev .nm{font-family:var(--font-d);font-size:21px;font-weight:780;letter-spacing:-.03em}

/* ---------- carregamento, toast, rodapé ---------- */
.skel{position:relative;overflow:hidden;background:var(--fill);border-radius:22px}
.loading-wrap{display:grid;gap:16px}
.errbox{padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--tab-h));z-index:120;transform:translateX(-50%);padding:11px 18px;border-radius:999px;font-weight:640;font-size:14px;animation:toast 2.6s var(--spring) both;max-width:calc(100% - 32px);text-align:center;background:var(--glass-2);display:flex;align-items:center;gap:8px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,18px) scale(.9)}12%,84%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,8px) scale(.96)}}
.foot{color:var(--fg-2);font-size:13px;padding-block:8px 44px;display:grid;gap:14px}
.foot h3{color:var(--fg);font-size:15px;margin:0}
.foot ul{margin:0;padding-left:18px;display:grid;gap:6px;max-width:82ch}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline}
.src-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}

@media (max-width:560px){
  .brand span{display:none}
  .p-hero{grid-template-columns:minmax(0,1fr);justify-items:start;padding-top:22px}
  .row .r{min-width:76px}.bar{width:76px}
  .stat .h{font-size:11.5px}
  .hide-sm{display:none}
}
@media (max-width:360px){.stats{grid-template-columns:1fr 1fr}.stats .stat:nth-child(3){grid-column:1/-1;border-left:0;border-top:.5px solid var(--glass-edge)}}

::view-transition-old(main){animation:vtOut .26s var(--ease) both}
::view-transition-new(main){animation:vtIn .5s var(--out) both}

@keyframes vtIn{from{opacity:0;transform:translateY(12px) scale(.99);filter:blur(4px)}}

/* ---------------- estado e utilidades ---------------- */
const store={get(k,d){try{const v=localStorage.getItem('bc:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('bc:'+k,JSON.stringify(v))}catch(e){}}};
const navLang=(navigator.language||'pt').slice(0,2);
const state={
  lang:store.get('lang',LANGS.includes(navLang)?navLang:'pt'),
  view:'now', sel:'piper', pickCls:'all',
  favs:new Set(store.get('favs',[])), recent:store.get('recent',[]),
  rk:{cls:new Set(),rar:'all',mode:'all',sort:'wr',dir:-1},
  cmp:['piper','ash'], theme:store.get('theme','auto'),
  draft:{mode:store.get('dmode','any'),enemy:[null,null,null],ally:[null,null],example:true},
  cmode:'GG', showAll:{st:false,wk:false}, mapMode:'all'
};
let DATA=[],TRIOS={},META={},LIVE=null,STATIC=null,NAMES=null,TIPS={},ROT=[],MAPS={};
let byName=new Map(), bySlug=new Map(), MU=new Map(), SY=new Map();
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const norm=s=>fold(s).replace(/[^a-z0-9]/g,'');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const t=(k,v={})=>{let s=(I18N[state.lang]&&I18N[state.lang][k])??I18N.pt[k]??k;for(const [a,b] of Object.entries(v))s=s.split('{'+a+'}').join(b);return s};
const loc=()=>LOCALE[state.lang];
const fmt=(n,d=1)=>Number(n).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(n,d=1)=>(n>0?'+':n<0?'−':'±')+fmt(Math.abs(n),d);
const haptic=()=>{try{navigator.vibrate&&navigator.vibrate(6)}catch(e){}};

/* ---------------- nomes traduzidos ---------------- */
const li=()=>LI[state.lang];
function clsName(c){const m=NAMES?.classes?.[CLS_ID[c]];return m?m.n[state.lang]:(CLS_FB[c]||CLS_FB.NA)[li()]}
const clsShort=c=>t('cls.short.'+c);
function rarName(r){const m=NAMES?.rarities?.[RAR_ID[r]];return m?m.n[state.lang]:(RAR_FB[r]||RAR_FB['?'])[li()]}
let MODE_META={};
function indexModes(){MODE_META={};if(!NAMES?.modes)return;const byEn={};for(const [id,m] of Object.entries(NAMES.modes))byEn[norm(m.n.en)]={...m,id:+id};for(const [c,en] of Object.entries(MODE_EN)){const x=byEn[norm(en)];if(x)MODE_META[c]=x}}
function modeName(c){const m=MODE_META[c];if(m)return m.n[state.lang];return (MODE_FB[c]||[MODE_EN[c]||c,MODE_EN[c]||c,MODE_EN[c]||c])[li()]}
const modeId=c=>MODE_META[c]?.id||MODE_ID[c]||null;
const modeColor=c=>MODE_META[c]?.color||MODE_COLOR[c]||'var(--accent)';
function mapName(id,fallback){const m=NAMES?.maps?.[id];return m?m.n[state.lang]:(fallback||LIVE?.mapIndex?.[id]?.[0]||'')}
function metaOf(b){return NAMES?.brawlers?.[b.n]||NAMES?.brawlers?.[b._metaKey]||null}
function itemInfo(b,kind,en){
  const m=metaOf(b); if(!m) return {id:null,n:en};
  if(kind==='hc'){return m.hc?{id:m.hc.id,n:m.hc.n[state.lang]}:{id:null,n:en}}
  const list=kind==='gd'?m.gd:m.sp; const x=list?.find(i=>norm(i.n.en)===norm(en));
  return x?{id:x.id,n:x.n[state.lang]}:{id:null,n:en};
}
function gearInfo(en){
  const g=NAMES?.gears; if(g){for(const [id,x] of Object.entries(g)) if(norm(x.n.en)===norm(en)) return {id:+id,n:x.n[state.lang]}}
  const f=GEAR_FB[en]; return f?{id:f[0],n:f[1+li()]}:{id:null,n:en};
}
function tipsOf(b){if(state.lang==='pt')return b.tips||[];return TIPS[b.n]?.[state.lang]?.tips||b.tips||[]}
function whyOf(b){if(state.lang==='pt')return b.why||'';return TIPS[b.n]?.[state.lang]?.why||b.why||''}

/* ---------------- imagens com reserva ---------------- */
function nextSrc(img){const alts=(img.dataset.alt||'').split('|').filter(Boolean);if(alts.length){img.src=alts.shift();img.dataset.alt=alts.join('|');return}
  const p=img.parentNode;if(img.dataset.fb==='mono'&&p){p.classList.remove('loading');p.classList.add('mono-bg');p.innerHTML='<span class="mono">'+esc(img.dataset.l||'?')+'</span>'}else if(img.dataset.fb==='icon'&&p){p.innerHTML=img.dataset.svg?`<svg aria-hidden="true"><use href="#i-${img.dataset.svg}"/></svg>`:''}else img.remove()}
window.nextSrc=nextSrc;
function imgTag(urls,extra=''){const [a,...r]=urls.filter(Boolean);return a?`<img alt="" src="${a}" data-alt="${r.join('|')}" decoding="async" loading="lazy" onload="this.classList.add('ok');this.parentNode&&this.parentNode.classList.remove('loading')" onerror="nextSrc(this)" ${extra}>`:''}
const fullId=b=>b.id==null?null:(b.id<1e6?16000000+b.id:b.id);

/* ---------------- modelo: matchups e sinergia ---------------- */
const key=(a,b)=>a+'|'+b;
function buildModel(){
  MU=new Map();SY=new Map();
  const add=(m,a,b,v)=>{const k=key(a,b);const x=m.get(k)||[];x.push(v);m.set(k,x)};
  for(const b of DATA){for(const [n,p] of b.st){add(MU,b.n,n,p);add(MU,n,b.n,-p)}for(const [n,p] of b.wk){add(MU,b.n,n,-p);add(MU,n,b.n,p)}for(const [n,p] of (b.mt||[])){add(SY,b.n,n,p);add(SY,n,b.n,p)}}
  for(const m of [MU,SY])for(const [k,v] of m)m.set(k,v.reduce((a,c)=>a+c,0)/v.length);
}
const mu=(a,b)=>MU.has(key(a,b))?MU.get(key(a,b)):null;
const sy=(a,b)=>SY.get(key(a,b))||0;
const power=b=>b.wr==null?0:b.wr-50;
const modeWr=(b,m)=>{if(!b.mr)return null;const x=b.m.find(([c])=>c===m);return x?x[1]:null};
const modePow=(b,m)=>{const w=modeWr(b,m);return w==null?0:w-50};

function buildMini(b){
  if(!b.b) return `<span class="mini-note" style="padding:0">${t('p.noBuild',{n:esc(b.n)})}</span>`;
  const B=b.b,out=[];
  if(B.gd[0]){const i=itemInfo(b,'gd',B.gd[0].n);out.push(['gd',i.id,i.n])}
  if(B.sp[0]){const i=itemInfo(b,'sp',B.sp[0].n);out.push(['sp',i.id,i.n])}
  if(B.hc[0]){const i=itemInfo(b,'hc',B.hc[0].n);out.push(['hc',i.id,i.n])}

function soloScore(c,E,mode){let sum=0,known=0;const parts=[];for(const e of E){const v=mu(c.n,e.n);parts.push([e,v]);if(v!=null){sum+=v;known++}}const mp=mode!=='any'?modePow(c,mode):0;return {c,score:sum+0.35*power(c)+0.25*mp,sum,known,parts,mp}}
function bestSolos(E,mode,exclude){return DATA.filter(b=>!exclude.has(b.s)).map(b=>soloScore(b,E,mode)).sort((a,b)=>b.score-a.score)}
function trioScore(T,E,mode){let s=0;const per=T.map(x=>soloScore(x,E,mode));per.forEach(p=>s+=p.score);const syn=[];for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){const v=sy(T[i].n,T[j].n);if(v)syn.push([T[i],T[j],v]);s+=0.5*v}s-=1.5*(3-new Set(T.map(x=>x.c)).size);return {T,score:s,per,syn}}
function bestTrios(E,mode,locked,exclude){const need=3-locked.length;const pool=bestSolos(E,mode,new Set([...exclude,...locked.map(b=>b.s)])).slice(0,need===3?28:40).map(x=>x.c);const res=[];const push=T=>res.push(trioScore(T,E,mode));
  if(need===0)push(locked);else if(need===1)pool.forEach(a=>push([...locked,a]));else if(need===2){for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++)push([...locked,pool[i],pool[j]])}else{for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++)for(let k=j+1;k<pool.length;k++)push([pool[i],pool[j],pool[k]])}
  return res.sort((a,b)=>b.score-a.score)}

function computedTrios(mode){const pool=DATA.filter(b=>modeWr(b,mode)!=null).sort((a,b)=>modeWr(b,mode)-modeWr(a,mode)).slice(0,22);const res=[];for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++)for(let k=j+1;k<pool.length;k++){const T=[pool[i],pool[j],pool[k]];let s=T.reduce((a,b)=>a+modePow(b,mode),0);s+=sy(T[0].n,T[1].n)+sy(T[0].n,T[2].n)+sy(T[1].n,T[2].n);s-=2*(3-new Set(T.map(x=>x.c)).size);res.push({T,s})}return res.sort((a,b)=>b.s-a.s).slice(0,6)}

}
$('#nowOut').addEventListener('click',e=>{const x=e.target.closest('[data-nowdraft]');if(x){state.draft.mode=x.dataset.nowdraft;store.set('dmode',state.draft.mode);setView('draft')}});
setInterval(()=>{$$('.ev-time[data-end]').forEach(el=>{const ms=+el.dataset.end-Date.now();el.innerHTML=`<b>${left(ms)}</b>${ms>0?t('now.left'):''}`;if(ms<=0)el.closest('.ev').classList.add('ended')});if(DATA.length)renderSub()},30000);

/* =========================================================================
   DADOS
   ========================================================================= */
const nkey=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const titleCase=s=>String(s).toLowerCase().replace(/(^|[\s\-.&])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const slugify=n=>n.toLowerCase().replace(/&/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const liveTier=wr=>wr>=55?'S+':wr>=53?'S':wr>=51?'A':wr>=49?'B':wr>=47?'C':'D';
const CODE_BY_CLS=Object.fromEntries(Object.entries(CLS_ID).map(([k,v])=>[v,k])), CODE_BY_RAR=Object.fromEntries(Object.entries(RAR_ID).map(([k,v])=>[v,k]));
function merge(st,lv,nm){
  const list=st.brawlers.map(b=>({...b,live:false,muLive:false,mLive:false}));
  const byKey=new Map(list.map(b=>[nkey(b.n),b]));
  const nameOf=raw=>(byKey.get(nkey(raw))||{}).n||titleCase(raw);
  // ids, classe e raridade oficiais
  if(nm?.brawlers){for(const [en,m] of Object.entries(nm.brawlers)){
    let b=byKey.get(nkey(en));
    if(!b){const n=en;b={n,s:slugify(n),id:m.id,r:CODE_BY_RAR[m.r]||'?',c:CODE_BY_CLS[m.c]||'NA',wr:null,pr:null,t:null,m:[],mr:false,st:[],wk:[],mt:[],b:null,tips:[],why:'',live:false,muLive:false,mLive:false,isNew:true};list.push(b);byKey.set(nkey(en),b)}
    b.id=m.id;b._metaKey=en;if(b.c==='NA'&&CODE_BY_CLS[m.c])b.c=CODE_BY_CLS[m.c];if((b.r==='?'||!b.r)&&CODE_BY_RAR[m.r]!=null)b.r=CODE_BY_RAR[m.r];
  }}
  if(lv){
    for(const x of (lv.list||[])){if(!byKey.has(nkey(x.name))){const n=titleCase(x.name);const b={n,s:slugify(n),id:x.id,r:'?',c:'NA',wr:null,pr:null,t:null,m:[],mr:false,st:[],wk:[],mt:[],b:null,tips:[],why:'',live:false,muLive:false,mLive:false,isNew:true};list.push(b);byKey.set(nkey(x.name),b)}else{const b=byKey.get(nkey(x.name));if(b.id==null)b.id=x.id}}
    for(const [raw,L] of Object.entries(lv.brawlers||{})){
      const b=byKey.get(nkey(raw));if(!b)continue;
      if(L.g>=60&&L.wr!=null){b.wr=L.wr;b.pr=L.pr;b.g=L.g;b.t=liveTier(L.wr);b.live=true}
      const ms=Object.entries(L.modes||{}).filter(([m,[g]])=>g>=25);
      if(ms.filter(([m])=>RANKED_MODES.includes(m)).length>=2){b.m=ms.map(([m,[g,wr]])=>[m,wr]).sort((a,c)=>c[1]-a[1]);b.mr=true;b.mLive=true}
      const mp=l=>(l||[]).map(([n,p,g])=>[nameOf(n),p,g]).filter(([n])=>byKey.has(nkey(n)));
      if((L.st||[]).length>=3&&(L.wk||[]).length>=3){b.st=mp(L.st);b.wk=mp(L.wk);b.muLive=true}
      if((L.mt||[]).length>=3)b.mt=mp(L.mt);
      if(L.bm)b.bm=L.bm;
    }
  }
  for(const b of list){if(!b.tips||!b.tips.length)b.tips=['—'];if(!b.c)b.c='NA';if(!b.r)b.r='?'}
  let trios={...(st.trios||{})};trios._live={};
  for(const [m,l] of Object.entries(lv?.trios||{}))if(l.length>=3){trios[m]=l.map(x=>({t:x.t.map(nameOf),wr:x.wr,ex:x.ex,g:x.g,map:''}));trios._live[m]=true}
  const rot=(lv?.rotation||[]).map(e=>({...e,top:(e.top||[]).map(([n,w,g])=>[nameOf(n),w,g])}));
  return {list,trios,rot};
}
function applyData(){
  const {list,trios,rot}=merge(STATIC,LIVE,NAMES);
  DATA=list;TRIOS=trios;ROT=rot;META=STATIC.meta||{};
  byName=new Map(DATA.map(b=>[b.n,b]));bySlug=new Map(DATA.map(b=>[b.s,b]));
  indexModes();buildModel();
}
function ago(iso){const d=(Date.now()-new Date(iso))/60000;if(!(d>=0))return '';if(d<1)return t('ago.now');if(d<60)return t('ago.min',{n:Math.round(d)});const h=Math.floor(d/60);return h<24?t('ago.h',{n:h}):t('ago.d',{n:Math.floor(h/24)})}
function fmtDate(iso){try{const d=iso.length<=10?(()=>{const [y,m,dd]=iso.split('-').map(Number);return new Date(y,m-1,dd)})():new Date(iso);return d.toLocaleDateString(loc(),{day:'numeric',month:'short',year:'numeric'})}catch(e){return iso}}
function renderSub(){
  if(LIVE){const M=LIVE.meta,stale=(Date.now()-new Date(M.updated))>3*3600e3;
    $('#pageSub').innerHTML=`<span class="live-dot ${stale?'off':''}"></span><b>${t(stale?'sub.stale':'sub.live')}</b> · ${t('sub.liveTxt',{ago:ago(M.updated),b:fmt(M.battles,0),p:fmt(M.players,0),d:M.windowDays})}`}
  else $('#pageSub').innerHTML=`${t('sub.ref',{n:DATA.length,d:fmtDate(META.updated||'')})}<br><span style="color:var(--fg-3);font-size:13px">${t('sub.refWait')}</span>`;
}
function renderFoot(){
  const a=(u,txt)=>`<a href="${u}" target="_blank" rel="noopener">${txt}</a>`;
  const dates=[t('foot.dates',{d:fmtDate(META.updated||'')})];if(LIVE)dates.push(t('foot.liveDate',{d:new Date(LIVE.meta.updated).toLocaleString(loc())}));if(NAMES?.updated)dates.push(t('foot.metaDate',{d:fmtDate(NAMES.updated)}));
  $('#foot').innerHTML=`<div class="src-grid"><div><h3>${t('foot.src')}</h3><ul>
    <li>${t('foot.live',{a:a('https://developer.brawlstars.com/',t('foot.api'))})}</li>
    <li>${t('foot.ref',{bp:a('https://www.brawlplanet.com/brawlers','BrawlPlanet'),sm:a('https://seemeta.com/en/brawl-stars/tier-list','SeeMeta')})}</li>
    <li>${t('foot.build',{bt:a('https://brawltime.ninja/tier-list/brawler','Brawl Time Ninja')})}</li>
    <li>${t('foot.names',{bf:a('https://brawlify.com/','Brawlify'),cdn:a('https://github.com/Brawlify/CDN','Brawlify CDN')})}</li>
    <li>${dates.join(' ')}</li></ul></div>
    <div><h3>${t('foot.lim')}</h3><ul><li>${t('foot.lim1')}</li><li>${t('foot.lim2')}</li><li>${t('foot.lim3')}</li><li>${t('foot.lim4')}</li></ul></div></div>`;
}
function rerender(){
  renderPickFilters();renderGrid();renderMiniRows();renderRkControls();
  if(bySlug.has(state.sel))renderProfile(state.sel,false);
  if(state.view==='now')renderNow();if(state.view==='draft')renderDraft();if(state.view==='comps')renderComps();if(state.view==='ranking')renderRanking(false);if(state.view==='compare')renderCompare();
}
async function getJSON(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Math.floor(Date.now()/60000),{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
async function load(){
  $('#loading').hidden=false;$('#err').hidden=true;
  try{
    const [st,lv,nm,tp]=await Promise.all([getJSON(URLS.stat),getJSON(URLS.live).catch(()=>null),getJSON(URLS.meta).catch(()=>null),getJSON(URLS.tips).catch(()=>({}))]);
    STATIC=st;LIVE=lv&&lv.meta?lv:null;NAMES=nm&&nm.brawlers?nm:null;TIPS=tp||{};applyData();boot();
  }catch(e){console.error(e);$('#loading').hidden=true;$('#err').hidden=false;$('#pageSub').textContent=t('err.sub')}
}
async function poll(){try{const lv=await getJSON(URLS.live);if(lv&&lv.meta&&(!LIVE||lv.meta.updated!==LIVE.meta.updated)){LIVE=lv;applyData();rerender();renderSub();renderFoot();toast(t('sub.updated'))}}catch(e){}}
$('#retry').addEventListener('click',load);

/* =========================================================================
   INÍCIO
   ========================================================================= */
function readHash(){return decodeURIComponent((location.hash||'').slice(1)).toLowerCase()}
function boot(){
  applyTheme();applyStaticI18n();$('#loading').hidden=true;renderSub();renderFoot();
  const top3=DATA.filter(b=>b.wr!=null).sort((a,b)=>b.wr-a.wr).slice(0,3).map(b=>b.s);state.draft.enemy=top3;state.draft.example=true;
  const h=readHash();if(bySlug.has(h))state.sel=h;else if(!bySlug.has(state.sel))state.sel=DATA[0].s;
  if(!bySlug.has(state.cmp[0]))state.cmp[0]=DATA[0].s;if(!bySlug.has(state.cmp[1]))state.cmp[1]=DATA[1].s;
  renderPickFilters();renderGrid();renderMiniRows();renderRkControls();
  state.view='';setView(bySlug.has(h)?'matchup':(HASH_IN[h]||'now'),{keepHash:true,noScroll:true,instant:true});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>placeLenses(true));
  setTimeout(()=>placeLenses(true),300);
  setInterval(poll,POLL_MS);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
}
addEventListener('hashchange',()=>{const h=readHash();if(bySlug.has(h)){if(h!==state.sel||state.view!=='matchup')select(h,{push:false})}else if(HASH_IN[h]&&HASH_IN[h]!==state.view)setView(HASH_IN[h],{keepHash:true})});
applyStaticI18n();applyTheme();
load();
</script>
