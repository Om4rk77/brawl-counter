name: Dados ao vivo

# Roda a cada hora:
#  1) metadados (fotos, itens, mapas e traduções) — sem chave, renovados 1x por dia
#  2) partidas do topo pela API oficial (precisa do segredo BS_API_KEY)
#  3) publica o site no GitHub Pages
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_meta:
        description: "Refazer os metadados agora"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o estado anterior (branch data)
        uses: actions/checkout@v4
        with:
          ref: data
          path: databranch
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preparar pastas
        run: |
          mkdir -p databranch/state site/data
          rm -rf databranch/.git
          for f in live.json meta.json; do
            if [ -f databranch/$f ]; then cp databranch/$f site/data/$f; fi
          done

      - name: Metadados (fotos, itens, mapas, traduções)
        continue-on-error: true
        env:
          OUT_META: site/data/meta.json
          FORCE_META: ${{ inputs.force_meta && '1' || '' }}
        run: node collector/meta.mjs

      - name: Coletar partidas da API oficial
        id: collect
        continue-on-error: true
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
          BS_API_BASE: ${{ vars.BS_API_BASE || 'https://bsproxy.royaleapi.dev/v1' }}
          COUNTRIES: ${{ vars.COUNTRIES || 'global,BR,US,MX,ES' }}
          STATE_DIR: databranch/state
          OUT_FILE: site/data/live.json
        run: |
          if [ -z "$BS_API_KEY" ]; then
            echo "::warning::Segredo BS_API_KEY ainda não configurado — o site usa os dados de referência."
            exit 0
          fi
          node collector/collect.mjs

      - name: Salvar o estado (branch data, sem histórico)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in live.json meta.json; do
            if [ -f site/data/$f ]; then cp site/data/$f databranch/$f; fi
          done
          cd databranch
          git init -q -b data
          git add -A
          git -c user.name="brawl-counter-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "dados $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
